<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - Chaddha Fashion</title>
    <style>
      :root {
        --bg: #f7f1ee;
        --panel: #f1e8e4;
        --text: #1d1d1d;
        --muted: #4b4b4b;
        --accent: #b91c5c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #efefef;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .page {
        width: min(1100px, 92%);
        margin: 40px auto;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1.2fr 3.5fr 0.3fr;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
        min-height: 80px;
        background: var(--panel);
        border: 1px solid rgba(0, 0, 0, 0.08);
        padding: 12px;
        border-radius: 4px;
      }

      .logo-box {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .logo-box img {
        max-width: 100%;
        max-height: 60px;
        object-fit: contain;
      }

      .nav-box {
        display: flex;
        gap: 28px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 14px;
      }

      .nav-box span {
        cursor: pointer;
        transition: color 0.3s;
      }

      .nav-box span:hover {
        color: var(--accent);
      }

      .cart-icon {
        font-size: 28px;
        cursor: pointer;
      }

      .title {
        font-size: 32px;
        font-weight: 700;
        margin: 20px 0;
      }

      .cart-container {
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        padding: 20px;
        margin-bottom: 20px;
      }

      .cart-item {
        display: grid;
        grid-template-columns: 120px 1fr 100px 100px 80px;
        gap: 20px;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid #eee;
      }

      .cart-item:last-child {
        border-bottom: none;
      }

      .cart-item img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border-radius: 4px;
      }

      .item-details h4 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .item-details p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .item-price {
        font-weight: 600;
        font-size: 18px;
      }

      .item-quantity {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .qty-btn {
        background: var(--panel);
        border: none;
        padding: 4px 8px;
        cursor: pointer;
        border-radius: 3px;
      }

      .qty-btn:hover {
        background: var(--accent);
        color: white;
      }

      .remove-btn {
        background: #ff6b6b;
        color: white;
        border: none;
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 3px;
        font-size: 12px;
      }

      .remove-btn:hover {
        background: #ff5252;
      }

      .empty-cart {
        text-align: center;
        padding: 40px;
        color: var(--muted);
      }

      .empty-cart p {
        font-size: 18px;
        margin-bottom: 20px;
      }

      .summary {
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        padding: 20px;
        max-width: 400px;
        margin-left: auto;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 16px;
      }

      .summary-row.total {
        font-weight: 700;
        font-size: 20px;
        border-top: 2px solid #eee;
        padding-top: 12px;
      }

      .checkout-btn {
        width: 100%;
        background: var(--accent);
        color: white;
        border: none;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 4px;
        margin-top: 16px;
        transition: background 0.3s;
      }

      .logout-btn {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .checkout-btn:hover {
        background: #ff2d7d;
      }

      .checkout-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .continue-shopping {
        background: var(--panel);
        color: var(--text);
        border: none;
        padding: 12px 20px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: 600;
        margin-bottom: 16px;
      }

      .continue-shopping:hover {
        background: var(--accent);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo-box" onclick="goHome()">
          <img src="./chaddha-logo.svg" alt="Chaddha Fashion logo" />
        </div>
        <nav class="nav-box">
          <span onclick="goHome()">Home</span>
          <span>Men</span>
          <span>Women</span>
          <span>Kids</span>
          <span>Sale</span>
          <span onclick="location.href='blog.html'">Blog</span>
        </nav>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="cart-icon" onclick="location.reload()">🛒</div>
          <button class="logout-btn" onclick="logoutUser()">Logout</button>
        </div>
      </header>

      <h1 class="title">Shopping Cart</h1>

      <div class="cart-container">
        <div id="cart-items"></div>
      </div>

      <div class="summary">
        <button class="continue-shopping" onclick="goHome()">Continue Shopping</button>
        <div class="summary-row">
          <span>Subtotal:</span>
          <span id="subtotal">₹0</span>
        </div>
        <div class="summary-row">
          <span>Shipping:</span>
          <span id="shipping">₹0</span>
        </div>
        <div class="summary-row">
          <span>Tax (10%):</span>
          <span id="tax">₹0</span>
        </div>
        <div class="summary-row total">
          <span>Total:</span>
          <span id="total">₹0</span>
        </div>
        <button class="checkout-btn" onclick="goToCheckout()" id="checkout-btn">Proceed to Checkout</button>
      </div>
    </div>

    <script>
      function checkLogin() {
        const loggedIn = localStorage.getItem('chaddha_logged_in');
        if (loggedIn !== 'true') {
          window.location.href = 'login.html';
          return false;
        }
        return true;
      }

      function logoutUser() {
        localStorage.removeItem('chaddha_logged_in');
        localStorage.removeItem('chaddha_user_email');
        localStorage.removeItem('chaddha_user_password');
        window.location.href = 'login.html';
      }

      checkLogin();

      // Get cart from localStorage
      let cart = JSON.parse(localStorage.getItem('cart')) || [];

      const SHIPPING_COST = 99;
      const TAX_RATE = 0.10;

      function renderCart() {
        const container = document.getElementById('cart-items');
        
        if (cart.length === 0) {
          container.innerHTML = '<div class="empty-cart"><p>Your cart is empty</p><button class="continue-shopping" onclick="goHome()">Start Shopping</button></div>';
          document.getElementById('checkout-btn').disabled = true;
          updateSummary();
          return;
        }

        container.innerHTML = cart.map((item, index) => `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}" />
            <div class="item-details">
              <h4>${item.name}</h4>
              <p>${item.description}</p>
            </div>
            <div class="item-price">₹${item.price}</div>
            <div class="item-quantity">
              <button class="qty-btn" onclick="removeItem(${index})">Remove</button>
            </div>
          </div>
        `).join('');

        document.getElementById('checkout-btn').disabled = false;
        updateSummary();
      }

      function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
      }

      function updateSummary() {
        const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
        const shipping = cart.length > 0 ? SHIPPING_COST : 0;
        const tax = subtotal * TAX_RATE;
        const total = subtotal + shipping + tax;

        document.getElementById('subtotal').textContent = `₹${subtotal}`;
        document.getElementById('shipping').textContent = `₹${shipping}`;
        document.getElementById('tax').textContent = `₹${Math.round(tax)}`;
        document.getElementById('total').textContent = `₹${Math.round(total)}`;
      }

      function goHome() {
        window.location.href = 'index.html';
      }

      function goToCheckout() {
        if (cart.length === 0) {
          alert('Your cart is empty!');
          return;
        }
        window.location.href = 'checkout.html';
      }

      // Initialize
      renderCart();
    </script>
  </body>
</html>
