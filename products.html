<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Products - Chaddha Fashion</title>
    <style>
      :root {
        --bg: #f7f1ee;
        --panel: #f1e8e4;
        --text: #1d1d1d;
        --muted: #4b4b4b;
        --accent: #b91c5c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #efefef;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .page {
        width: min(1200px, 92%);
        margin: 40px auto;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1.2fr 3.5fr 0.3fr;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
        min-height: 80px;
        background: var(--panel);
        border: 1px solid rgba(0, 0, 0, 0.08);
        padding: 12px;
        border-radius: 4px;
      }

      .logo-box {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .logo-box img {
        max-width: 100%;
        max-height: 60px;
        object-fit: contain;
      }

      .nav-box {
        display: flex;
        gap: 28px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 14px;
      }

      .nav-box span {
        cursor: pointer;
        transition: color 0.3s;
      }

      .nav-box span:hover {
        color: var(--accent);
      }

      .cart-icon {
        font-size: 28px;
        cursor: pointer;
        position: relative;
      }

      .cart-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: var(--accent);
        color: white;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
      }

      .title {
        font-size: 32px;
        font-weight: 700;
        margin: 20px 0;
      }

      .products-wrapper {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 20px;
      }

      .sidebar {
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        padding: 16px;
        height: fit-content;
        position: sticky;
        top: 20px;
      }

      .sidebar h3 {
        margin: 0 0 12px;
        font-size: 16px;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 8px;
      }

      .filter-group {
        margin-bottom: 16px;
      }

      .filter-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .filter-group input {
        cursor: pointer;
      }

      .clear-filters {
        background: var(--panel);
        border: none;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 4px;
        width: 100%;
        font-weight: 600;
      }

      .clear-filters:hover {
        background: var(--accent);
        color: white;
      }

      .products-section {
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        padding: 20px;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 18px;
      }

      .product-card {
        background: #f5f5f5;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        overflow: hidden;
        transition: transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
        position: relative;
      }

      .product-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      .product-image-wrapper {
        position: relative;
        width: 100%;
        height: 180px;
        overflow: hidden;
        background: #f5f5f5;
      }

      .product-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s;
      }

      .product-card:hover .product-image {
        transform: scale(1.08);
      }

      .add-to-cart-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .product-card:hover .add-to-cart-overlay {
        opacity: 1;
      }

      .add-cart-btn-overlay {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: background 0.3s, transform 0.2s;
      }

      .add-cart-btn-overlay:hover {
        background: #ff2d7d;
        transform: scale(1.05);
      }

      .product-info {
        padding: 12px;
      }

      .product-name {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        height: 36px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .product-description {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--muted);
        height: 32px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .product-price {
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: 700;
        color: var(--accent);
      }

      .product-category {
        margin: 0 0 10px;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .add-cart-btn {
        width: 100%;
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px;
        border-radius: 3px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: background 0.3s;
      }

      .add-cart-btn:hover {
        background: #ff2d7d;
      }

      .no-products {
        text-align: center;
        padding: 40px;
        color: var(--muted);
        font-size: 18px;
      }

      @media (max-width: 760px) {
        .products-wrapper {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .products-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo-box" onclick="goHome()">
          <img src="./chaddha-logo.svg" alt="Chaddha Fashion logo" />
        </div>
        <nav class="nav-box">
          <span onclick="goHome()">Home</span>
          <span onclick="filterByCategory('men')">Men</span>
          <span onclick="filterByCategory('women')">Women</span>
          <span onclick="filterByCategory('kids')">Kids</span>
          <span>Sale</span>
          <span onclick="location.href='blog.html'">Blog</span>
        </nav>
        <div class="cart-icon" onclick="goToCart()">
          🛒
          <div class="cart-badge" id="cart-count">0</div>
        </div>
      </header>

      <h1 class="title">All Products</h1>

      <div class="products-wrapper">
        <!-- Sidebar Filters -->
        <aside class="sidebar">
          <h3>Filters</h3>
          
          <div class="filter-group">
            <label><input type="checkbox" value="men" onchange="applyFilters()"> Men</label>
            <label><input type="checkbox" value="women" onchange="applyFilters()"> Women</label>
            <label><input type="checkbox" value="kids" onchange="applyFilters()"> Kids</label>
          </div>

          <div class="filter-group">
            <label><input type="checkbox" value="featured" onchange="applyFilters()"> Featured</label>
            <label><input type="checkbox" value="new" onchange="applyFilters()"> New Arrivals</label>
            <label><input type="checkbox" value="bestseller" onchange="applyFilters()"> Best Sellers</label>
          </div>

          <button class="clear-filters" onclick="clearAllFilters()">Clear Filters</button>
        </aside>

        <!-- Products Section -->
        <div class="products-section">
          <div class="products-grid" id="products-grid">
            <!-- Products will be inserted here -->
          </div>
          <div id="no-products" class="no-products" style="display:none;">
            No products found matching your filters
          </div>
        </div>
      </div>
    </div>

    <script>
      // All products data
      const allProducts = [
        {
          id: 1,
          name: "Premium Men's Fashion",
          image: './Box 1.jpg',
          price: 1999,
          description: 'Premium quality men\'s fashion collection with latest trends',
          category: 'men',
          featured: true,
          newArrival: true,
          bestSeller: false,
          trending: true
        },
        {
          id: 2,
          name: "Women's Essentials",
          image: './box 2.jpg',
          price: 2499,
          description: 'Beautiful women\'s collection for every occasion',
          category: 'women',
          featured: true,
          newArrival: false,
          bestSeller: true,
          trending: true
        },
        {
          id: 3,
          name: "Kids Collection",
          image: './box 3.jpg',
          price: 999,
          description: 'Comfortable and stylish clothing for kids',
          category: 'kids',
          featured: true,
          newArrival: true,
          bestSeller: true,
          trending: false
        },
        {
          id: 4,
          name: "Summer Dress Collection",
          image: './box 2.jpg',
          price: 1599,
          description: 'Lightweight and comfortable summer dresses',
          category: 'women',
          featured: false,
          newArrival: true,
          bestSeller: false,
          trending: true
        },
        {
          id: 5,
          name: "Casual Men's Wear",
          image: './Box 1.jpg',
          price: 1299,
          description: 'Casual and comfortable men\'s clothing line',
          category: 'men',
          featured: false,
          newArrival: false,
          bestSeller: true,
          trending: true
        },
        {
          id: 6,
          name: "Kids Sports Wear",
          image: './box 3.jpg',
          price: 799,
          description: 'Active wear for kids with great comfort',
          category: 'kids',
          featured: false,
          newArrival: true,
          bestSeller: true,
          trending: false
        }
      ];

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let activeFilters = {
        categories: [],
        types: []
      };

      function updateCartCount() {
        document.getElementById('cart-count').textContent = cart.length;
      }

      function renderProducts(productsToShow) {
        const grid = document.getElementById('products-grid');
        const noProducts = document.getElementById('no-products');

        if (productsToShow.length === 0) {
          grid.innerHTML = '';
          noProducts.style.display = 'block';
          return;
        }

        noProducts.style.display = 'none';
        grid.innerHTML = productsToShow.map(product => `
          <div class="product-card">
            <div class="product-image-wrapper">
              <img src="${product.image}" alt="${product.name}" class="product-image" />
              <div class="add-to-cart-overlay">
                <button class="add-cart-btn-overlay" onclick="addToCart(${product.id}, event)">+ Add to Cart</button>
              </div>
            </div>
            <div class="product-info">
              <div class="product-category">${product.category}</div>
              <h4 class="product-name">${product.name}</h4>
              <p class="product-description">${product.description}</p>
              <div class="product-price">₹${product.price}</div>
            </div>
          </div>
        `).join('');
      }

      function applyFilters() {
        const categoryCheckboxes = document.querySelectorAll('.filter-group input[value="men"], .filter-group input[value="women"], .filter-group input[value="kids"]');
        const typeCheckboxes = document.querySelectorAll('.filter-group input[value="featured"], .filter-group input[value="new"], .filter-group input[value="bestseller"]');

        activeFilters.categories = Array.from(categoryCheckboxes)
          .filter(cb => cb.checked)
          .map(cb => cb.value);

        activeFilters.types = Array.from(typeCheckboxes)
          .filter(cb => cb.checked)
          .map(cb => cb.value);

        const filtered = allProducts.filter(product => {
          let categoryMatch = activeFilters.categories.length === 0 || activeFilters.categories.includes(product.category);
          
          let typeMatch = true;
          if (activeFilters.types.length > 0) {
            typeMatch = activeFilters.types.some(type => {
              if (type === 'featured') return product.featured;
              if (type === 'new') return product.newArrival;
              if (type === 'bestseller') return product.bestSeller;
              return false;
            });
          }

          return categoryMatch && typeMatch;
        });

        renderProducts(filtered);
      }

      function clearAllFilters() {
        document.querySelectorAll('.filter-group input').forEach(cb => cb.checked = false);
        activeFilters = { categories: [], types: [] };
        renderProducts(allProducts);
      }

      function filterByCategory(category) {
        clearAllFilters();
        const categoryCheckbox = Array.from(document.querySelectorAll('.filter-group input')).find(cb => cb.value === category);
        if (categoryCheckbox) {
          categoryCheckbox.checked = true;
          applyFilters();
        }
      }

      const requestedCategory = new URLSearchParams(window.location.search).get('category');

      function addToCart(productId, event) {
        if (event) {
          event.stopPropagation();
        }
        const product = allProducts.find(p => p.id === productId);
        if (product) {
          cart.push({...product, cartId: Date.now()});
          localStorage.setItem('cart', JSON.stringify(cart));
          updateCartCount();
          alert(`${product.name} added to cart!`);
        }
      }

      function goHome() {
        window.location.href = 'index.html';
      }

      function goToCart() {
        window.location.href = 'cart.html';
      }

      // Initialize
      updateCartCount();
      requestedCategory ? filterByCategory(requestedCategory) : renderProducts(allProducts);
    </script>
  </body>
</html>
