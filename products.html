<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Products - Chaddha Fashion</title>
    <style>
      :root {
        --bg: #f7f1ee;
        --panel: #f1e8e4;
        --text: #1d1d1d;
        --muted: #4b4b4b;
        --accent: #b91c5c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #efefef;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .page {
        width: min(1200px, 92%);
        margin: 40px auto;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1.2fr 3.5fr 0.3fr;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
        min-height: 80px;
        background: var(--panel);
        border: 1px solid rgba(0, 0, 0, 0.08);
        padding: 12px;
        border-radius: 4px;
      }

      .logo-box {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .logo-box img {
        max-width: 100%;
        max-height: 60px;
        object-fit: contain;
      }

      .nav-box {
        display: flex;
        gap: 28px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 14px;
      }

      .nav-box span {
        cursor: pointer;
        transition: color 0.3s;
      }

      .nav-box span:hover {
        color: var(--accent);
      }

      .cart-icon {
        font-size: 28px;
        cursor: pointer;
        position: relative;
      }

      .cart-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: var(--accent);
        color: white;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
      }

      .title {
        font-size: 32px;
        font-weight: 700;
        margin: 20px 0;
      }

      .products-wrapper {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 20px;
      }

      .sidebar {
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        padding: 16px;
        height: fit-content;
        position: sticky;
        top: 20px;
      }

      .sidebar h3 {
        margin: 0 0 12px;
        font-size: 16px;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 8px;
      }

      .filter-group {
        margin-bottom: 16px;
      }

      .filter-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .filter-group input {
        cursor: pointer;
      }

      .clear-filters {
        background: var(--panel);
        border: none;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 4px;
        width: 100%;
        font-weight: 600;
      }

      .clear-filters:hover {
        background: var(--accent);
        color: white;
      }

      .products-section {
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        padding: 20px;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 18px;
      }

      .product-card {
        background: #f5f5f5;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        overflow: hidden;
        transition: transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
        position: relative;
      }

      .product-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      .product-image-wrapper {
        position: relative;
        width: 100%;
        height: 180px;
        overflow: hidden;
        background: #f5f5f5;
      }

      .product-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s;
      }

      .product-card:hover .product-image {
        transform: scale(1.08);
      }

      .add-to-cart-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .product-card:hover .add-to-cart-overlay {
        opacity: 1;
      }

      .add-cart-btn-overlay {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: background 0.3s, transform 0.2s;
      }

      .add-cart-btn-overlay:hover {
        background: #ff2d7d;
        transform: scale(1.05);
      }

      .product-info {
        padding: 12px;
      }

      .product-name {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        height: 36px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .product-description {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--muted);
        height: 32px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .product-price {
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: 700;
        color: var(--accent);
      }

      .product-category {
        margin: 0 0 10px;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .add-cart-btn {
        width: 100%;
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px;
        border-radius: 3px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: background 0.3s;
      }

      .add-cart-btn:hover {
        background: #ff2d7d;
      }

      .no-products {
        text-align: center;
        padding: 40px;
        color: var(--muted);
        font-size: 18px;
      }

      @media (max-width: 760px) {
        .products-wrapper {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .products-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* Editorial catalog layer */
      :root {
        --ink: #172321;
        --muted: #64716d;
        --paper: #f8f6f1;
        --cream: #eee8dc;
        --forest: #173f3a;
        --coral: #d56b4f;
        --line: rgba(23, 35, 33, 0.13);
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      .page { width: min(1240px, calc(100% - 48px)); margin: 24px auto 48px; }
      .topbar { grid-template-columns: 190px 1fr auto; min-height: 76px; margin-bottom: 34px; padding: 10px 14px; background: rgba(255,255,255,0.72); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 30px rgba(23,35,33,0.06); }
      .logo-box { justify-content: flex-start; padding: 8px; }
      .logo-box, .nav-box { min-height: 56px; background: transparent; border: 0; }
      .logo-box img { max-height: 56px; }
      .nav-box { justify-content: center; align-items: center; gap: 8px; padding: 8px; }
      .nav-box span { color: var(--ink); border-radius: 10px; padding: 10px 14px; }
      .nav-box span:hover { color: var(--coral); background: var(--cream); }
      .cart-icon { min-height: 56px; padding: 10px 14px; color: var(--forest); border-radius: 12px; }
      .cart-icon:hover { background: var(--cream); }
      .cart-badge { background: var(--coral); }
      .title { margin: 0 0 28px; color: var(--forest); font-family: Georgia, serif; font-size: clamp(42px, 6vw, 72px); font-weight: 400; letter-spacing: -0.02em; }
      .products-wrapper { grid-template-columns: 230px 1fr; gap: 28px; align-items: start; }
      .sidebar { top: 22px; padding: 22px; background: var(--forest); color: #fffaf2; border: 0; border-radius: 16px; box-shadow: 0 16px 30px rgba(23,35,33,0.12); }
      .sidebar h3 { color: #fffaf2; border-bottom-color: var(--coral); font-family: Georgia, serif; font-size: 22px; font-weight: 400; }
      .filter-group strong { color: #f1c9af; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
      .filter-group label { color: #e6eeeb; }
      .filter-group input { accent-color: var(--coral); }
      .clear-filters { margin-top: 6px; background: #fffaf2; color: var(--forest); border-radius: 999px; padding: 11px 12px; }
      .clear-filters:hover { background: var(--coral); color: #fff; }
      .products-section { padding: 0; background: transparent; border: 0; }
      .products-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
      .product-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 20px rgba(23,35,33,0.05); }
      .product-card:hover { transform: translateY(-5px); box-shadow: 0 18px 32px rgba(23,35,33,0.13); }
      .product-image-wrapper { height: 270px; background: var(--cream); }
      .product-image { object-fit: cover; }
      .add-to-cart-overlay { background: rgba(23,63,58,0.72); }
      .add-cart-btn-overlay { background: var(--coral); border-radius: 999px; }
      .add-cart-btn-overlay:hover { background: #bd533b; }
      .product-info { padding: 16px; }
      .product-category { color: var(--coral); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
      .product-name { color: var(--ink); font-family: Georgia, serif; font-size: 19px; font-weight: 400; }
      .product-description { color: var(--muted); }
      .product-price { color: var(--forest); font-size: 20px; }
      .no-products { padding: 72px 30px; background: var(--cream); border-radius: 14px; }

      @media (max-width: 760px) {
        .page { width: min(100% - 28px, 620px); margin-top: 14px; }
        .topbar { grid-template-columns: 1fr auto; }
        .nav-box { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; overflow-x: auto; }
        .products-wrapper { grid-template-columns: 1fr; }
        .sidebar { position: static; }
        .products-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .product-image-wrapper { height: 210px; }
        .product-info { padding: 12px; }
        .product-name { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo-box" onclick="goHome()">
          <img src="./chaddha-logo.svg" alt="Chaddha Fashion logo" />
        </div>
        <nav class="nav-box">
          <span onclick="goHome()">Home</span>
          <span onclick="filterByCategory('men')">Men</span>
          <span onclick="filterByCategory('women')">Women</span>
          <span onclick="filterByCategory('kids')">Kids</span>
          <span>Sale</span>
          <span onclick="location.href='blog.html'">Blog</span>
        </nav>
        <div class="cart-icon" onclick="goToCart()">
          🛒
          <div class="cart-badge" id="cart-count">0</div>
        </div>
      </header>

      <h1 class="title">All Products</h1>

      <div class="products-wrapper">
        <!-- Sidebar Filters -->
        <aside class="sidebar">
          <h3>Filters</h3>
          
          <div class="filter-group">
            <label><input type="checkbox" value="men" onchange="applyFilters()"> Men</label>
            <label><input type="checkbox" value="women" onchange="applyFilters()"> Women</label>
            <label><input type="checkbox" value="kids" onchange="applyFilters()"> Kids</label>
          </div>

          <div class="filter-group">
            <strong>Collection</strong>
            <label><input type="checkbox" value="Men T-Shirt" onchange="applyFilters()"> Men T-Shirts</label>
            <label><input type="checkbox" value="Men Shirt" onchange="applyFilters()"> Men Shirts</label>
            <label><input type="checkbox" value="Women Dresses" onchange="applyFilters()"> Women Dresses</label>
            <label><input type="checkbox" value="Women Ethnic Wear" onchange="applyFilters()"> Women Ethnic Wear</label>
          </div>

          <div class="filter-group">
            <label><input type="checkbox" value="featured" onchange="applyFilters()"> Featured</label>
            <label><input type="checkbox" value="new" onchange="applyFilters()"> New Arrivals</label>
            <label><input type="checkbox" value="bestseller" onchange="applyFilters()"> Best Sellers</label>
          </div>

          <button class="clear-filters" onclick="clearAllFilters()">Clear Filters</button>
        </aside>

        <!-- Products Section -->
        <div class="products-section">
          <div class="products-grid" id="products-grid">
            <!-- Products will be inserted here -->
          </div>
          <div id="no-products" class="no-products" style="display:none;">
            No products found matching your filters
          </div>
        </div>
      </div>
    </div>

    <script>
      // Product catalog grouped by gender and collection.
      function getProductName(subcategory, price, imageNumber) {
        const namedProducts = {
          'Men T-Shirt-899': 'Men White T-Shirt',
          'Men T-Shirt-999': 'Men Light Brown Simple T-Shirt',
          'Men T-Shirt-1099': 'Men Brown T-Shirt',
          'Men T-Shirt-1199': 'Men Casual T-Shirt',
          'Men T-Shirt-1299': 'Men Casual Tshirt',
          'Men Shirt-1399': 'Men Maroon Shirt',
          'Men Shirt-1499': 'Men Blue Shirt',
          'Men Shirt-1599': 'Men Party Wear Black Shirt',
          'Men Shirt-1699': 'Men Formal Brown Shirt',
          'Women Dresses-1799': 'Women Floral Dress',
          'Women Dresses-1899': 'Women A Line Dress'
        };
        return namedProducts[`${subcategory}-${price}`] || (subcategory === 'Women Dresses' || subcategory === 'Women Ethnic Wear' ? subcategory : `${subcategory} ${imageNumber}`);
      }

      const allProducts = [
        ...[
          ['Men T-Shirt', 'Men Tshirt', 899], ['Men T-Shirt', 'Men Tshirt', 999], ['Men T-Shirt', 'Men Tshirt', 1099], ['Men T-Shirt', 'Men Tshirt', 1199], ['Men T-Shirt', 'Men Tshirt', 1299],
          ['Men Shirt', 'Men Shirt', 1399], ['Men Shirt', 'Men Shirt', 1499], ['Men Shirt', 'Men Shirt', 1599], ['Men Shirt', 'Men Shirt', 1699],
          ['Women Dresses', 'Women Dresses', 1799], ['Women Dresses', 'Women Dresses', 1899], ['Women Dresses', 'Women Dresses', 1999], ['Women Dresses', 'Women Dresses', 2099],
          ['Women Ethnic Wear', 'Women ethnic Dresses', 2199], ['Women Ethnic Wear', 'Women ethnic Dresses', 2299], ['Women Ethnic Wear', 'Women ethnic Dresses', 2399], ['Women Ethnic Wear', 'Women ethnic Dresses', 2499]
        ].map((item, index) => {
          const [subcategory, filePrefix, price] = item;
          const imageNumber = index < 5 ? index + 1 : ((index - 1) % 4) + 1;
          const category = subcategory.startsWith('Men') ? 'men' : 'women';
          const imageName = category === 'women' ? `${filePrefix} ${imageNumber}` : `${filePrefix} image ${imageNumber}`;
          return {
            id: index + 1,
            name: getProductName(subcategory, price, imageNumber),
            image: `./${imageName}.${category === 'men' ? 'avif' : 'jpg'}`,
            price,
            description: `Explore our ${subcategory.toLowerCase()} collection.`,
            category,
            subcategory,
            featured: index < 8,
            newArrival: index >= 4,
            bestSeller: index % 3 !== 0,
            trending: index % 2 === 0
          };
        }),
        {
          id: 18,
          name: 'Kids Collection',
          image: './box 3.jpg',
          price: 999,
          description: 'Comfortable and stylish clothing for kids',
          category: 'kids',
          featured: true,
          newArrival: true,
          bestSeller: true,
          trending: false
        },
        {
          id: 19,
          name: 'Kids Sports Wear',
          image: './box 3.jpg',
          price: 799,
          description: 'Active wear for kids with great comfort',
          category: 'kids',
          featured: false,
          newArrival: true,
          bestSeller: true,
          trending: false
        }
      ];

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let activeFilters = {
        categories: [],
        subcategories: [],
        types: []
      };

      function updateCartCount() {
        document.getElementById('cart-count').textContent = cart.length;
      }

      function renderProducts(productsToShow) {
        const grid = document.getElementById('products-grid');
        const noProducts = document.getElementById('no-products');

        if (productsToShow.length === 0) {
          grid.innerHTML = '';
          noProducts.style.display = 'block';
          return;
        }

        noProducts.style.display = 'none';
        grid.innerHTML = productsToShow.map(product => `
          <div class="product-card">
            <div class="product-image-wrapper">
              <img src="${product.image}" alt="${product.name}" class="product-image" />
              <div class="add-to-cart-overlay">
                <button class="add-cart-btn-overlay" onclick="addToCart(${product.id}, event)">+ Add to Cart</button>
              </div>
            </div>
            <div class="product-info">
              <div class="product-category">${product.category}</div>
              <h4 class="product-name">${product.name}</h4>
              <p class="product-description">${product.description}</p>
              <div class="product-price">₹${product.price}</div>
            </div>
          </div>
        `).join('');
      }

      function applyFilters() {
        const categoryCheckboxes = document.querySelectorAll('.filter-group input[value="men"], .filter-group input[value="women"], .filter-group input[value="kids"]');
        const subcategoryCheckboxes = document.querySelectorAll('.filter-group input[value="Men T-Shirt"], .filter-group input[value="Men Shirt"], .filter-group input[value="Women Dresses"], .filter-group input[value="Women Ethnic Wear"]');
        const typeCheckboxes = document.querySelectorAll('.filter-group input[value="featured"], .filter-group input[value="new"], .filter-group input[value="bestseller"]');

        activeFilters.categories = Array.from(categoryCheckboxes)
          .filter(cb => cb.checked)
          .map(cb => cb.value);

        activeFilters.subcategories = Array.from(subcategoryCheckboxes)
          .filter(cb => cb.checked)
          .map(cb => cb.value);

        activeFilters.types = Array.from(typeCheckboxes)
          .filter(cb => cb.checked)
          .map(cb => cb.value);

        const filtered = allProducts.filter(product => {
          let categoryMatch = activeFilters.categories.length === 0 || activeFilters.categories.includes(product.category);
          let subcategoryMatch = activeFilters.subcategories.length === 0 || activeFilters.subcategories.includes(product.subcategory);
          
          let typeMatch = true;
          if (activeFilters.types.length > 0) {
            typeMatch = activeFilters.types.some(type => {
              if (type === 'featured') return product.featured;
              if (type === 'new') return product.newArrival;
              if (type === 'bestseller') return product.bestSeller;
              return false;
            });
          }

          return categoryMatch && subcategoryMatch && typeMatch;
        });

        renderProducts(filtered);
      }

      function clearAllFilters() {
        document.querySelectorAll('.filter-group input').forEach(cb => cb.checked = false);
        activeFilters = { categories: [], subcategories: [], types: [] };
        renderProducts(allProducts);
      }

      function filterByCategory(category) {
        clearAllFilters();
        const categoryCheckbox = Array.from(document.querySelectorAll('.filter-group input')).find(cb => cb.value === category);
        if (categoryCheckbox) {
          categoryCheckbox.checked = true;
          applyFilters();
        }
      }

      const requestedCategory = new URLSearchParams(window.location.search).get('category');

      function addToCart(productId, event) {
        if (event) {
          event.stopPropagation();
        }
        const product = allProducts.find(p => p.id === productId);
        if (product) {
          cart.push({...product, cartId: Date.now()});
          localStorage.setItem('cart', JSON.stringify(cart));
          updateCartCount();
          alert(`${product.name} added to cart!`);
        }
      }

      function goHome() {
        window.location.href = 'index.html';
      }

      function goToCart() {
        window.location.href = 'cart.html';
      }

      // Initialize
      updateCartCount();
      requestedCategory ? filterByCategory(requestedCategory) : renderProducts(allProducts);
    </script>
  </body>
</html>
