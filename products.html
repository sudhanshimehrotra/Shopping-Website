<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse, search and filter the full Chaddha Fashion collection." />
    <title>All Products - Chaddha Fashion</title>
    <link rel="icon" href="./chaddha-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./shop.css" />
    <style>
      :root {
        --bg: #f7f1ee;
        --panel: #f1e8e4;
        --text: #1d1d1d;
        --muted: #4b4b4b;
        --accent: #b91c5c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #efefef;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .page {
        width: min(1200px, 92%);
        margin: 40px auto;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1.2fr 3.5fr 0.3fr;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
        min-height: 80px;
        background: var(--panel);
        border: 1px solid rgba(0, 0, 0, 0.08);
        padding: 12px;
        border-radius: 4px;
      }

      .logo-box {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .logo-box img {
        max-width: 100%;
        max-height: 60px;
        object-fit: contain;
      }

      .nav-box {
        display: flex;
        gap: 28px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 14px;
      }

      .nav-box span {
        cursor: pointer;
        transition: color 0.3s;
      }

      .nav-box span:hover {
        color: var(--accent);
      }

      .cart-icon {
        font-size: 28px;
        cursor: pointer;
        position: relative;
      }

      .cart-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: var(--accent);
        color: white;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
      }

      .title {
        font-size: 32px;
        font-weight: 700;
        margin: 20px 0;
      }

      .products-wrapper {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 20px;
      }

      .sidebar {
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        padding: 16px;
        height: fit-content;
        position: sticky;
        top: 20px;
      }

      .sidebar h3 {
        margin: 0 0 12px;
        font-size: 16px;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 8px;
      }

      .filter-group {
        margin-bottom: 16px;
      }

      .filter-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .filter-group input {
        cursor: pointer;
      }

      .clear-filters {
        background: var(--panel);
        border: none;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 4px;
        width: 100%;
        font-weight: 600;
      }

      .clear-filters:hover {
        background: var(--accent);
        color: white;
      }

      .products-section {
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        padding: 20px;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 18px;
      }

      .product-card {
        background: #f5f5f5;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        overflow: hidden;
        transition: transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
        position: relative;
      }

      .product-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      .product-image-wrapper {
        position: relative;
        width: 100%;
        height: 180px;
        overflow: hidden;
        background: #f5f5f5;
      }

      .product-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s;
      }

      .product-card:hover .product-image {
        transform: scale(1.08);
      }

      .add-to-cart-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .product-card:hover .add-to-cart-overlay {
        opacity: 1;
      }

      .add-cart-btn-overlay {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: background 0.3s, transform 0.2s;
      }

      .add-cart-btn-overlay:hover {
        background: #ff2d7d;
        transform: scale(1.05);
      }

      .product-info {
        padding: 12px;
      }

      .product-name {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        height: 36px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .product-description {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--muted);
        height: 32px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .product-price {
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: 700;
        color: var(--accent);
      }

      .product-category {
        margin: 0 0 10px;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .add-cart-btn {
        width: 100%;
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px;
        border-radius: 3px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: background 0.3s;
      }

      .add-cart-btn:hover {
        background: #ff2d7d;
      }

      .no-products {
        text-align: center;
        padding: 40px;
        color: var(--muted);
        font-size: 18px;
      }

      @media (max-width: 760px) {
        .products-wrapper {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .products-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* Editorial catalog layer */
      :root {
        --ink: #172321;
        --muted: #64716d;
        --paper: #f8f6f1;
        --cream: #eee8dc;
        --forest: #173f3a;
        --coral: #d56b4f;
        --line: rgba(23, 35, 33, 0.13);
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      .page { width: min(1240px, calc(100% - 48px)); margin: 24px auto 48px; }
      .topbar { grid-template-columns: 190px 1fr auto; min-height: 76px; margin-bottom: 34px; padding: 10px 14px; background: rgba(255,255,255,0.72); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 30px rgba(23,35,33,0.06); }
      .logo-box { justify-content: flex-start; padding: 8px; }
      .logo-box, .nav-box { min-height: 56px; background: transparent; border: 0; }
      .logo-box img { max-height: 56px; }
      .nav-box { justify-content: center; align-items: center; gap: 8px; padding: 8px; }
      .nav-box span { color: var(--ink); border-radius: 10px; padding: 10px 14px; }
      .nav-box span:hover { color: var(--coral); background: var(--cream); }
      .cart-icon { min-height: 56px; padding: 10px 14px; color: var(--forest); border-radius: 12px; }
      .cart-icon:hover { background: var(--cream); }
      .cart-badge { background: var(--coral); }
      .title { margin: 0 0 28px; color: var(--forest); font-family: Georgia, serif; font-size: clamp(42px, 6vw, 72px); font-weight: 400; letter-spacing: -0.02em; }
      .products-wrapper { grid-template-columns: 230px 1fr; gap: 28px; align-items: start; }
      .sidebar { top: 22px; padding: 22px; background: var(--forest); color: #fffaf2; border: 0; border-radius: 16px; box-shadow: 0 16px 30px rgba(23,35,33,0.12); }
      .sidebar h3 { color: #fffaf2; border-bottom-color: var(--coral); font-family: Georgia, serif; font-size: 22px; font-weight: 400; }
      .filter-group strong { color: #f1c9af; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
      .filter-group label { color: #e6eeeb; }
      .filter-group input { accent-color: var(--coral); }
      .clear-filters { margin-top: 6px; background: #fffaf2; color: var(--forest); border-radius: 999px; padding: 11px 12px; }
      .clear-filters:hover { background: var(--coral); color: #fff; }
      .products-section { padding: 0; background: transparent; border: 0; }
      .products-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
      .product-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 20px rgba(23,35,33,0.05); }
      .product-card:hover { transform: translateY(-5px); box-shadow: 0 18px 32px rgba(23,35,33,0.13); }
      .product-image-wrapper { height: 270px; background: var(--cream); }
      .product-image { object-fit: cover; }
      .add-to-cart-overlay { background: rgba(23,63,58,0.72); }
      .add-cart-btn-overlay { background: var(--coral); border-radius: 999px; }
      .add-cart-btn-overlay:hover { background: #bd533b; }
      .product-info { padding: 16px; }
      .product-category { color: var(--coral); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
      .product-name { color: var(--ink); font-family: Georgia, serif; font-size: 19px; font-weight: 400; }
      .product-description { color: var(--muted); }
      .product-price { color: var(--forest); font-size: 20px; }
      .no-products { padding: 72px 30px; background: var(--cream); border-radius: 14px; }

      @media (max-width: 760px) {
        .page { width: min(100% - 28px, 620px); margin-top: 14px; }
        .topbar { grid-template-columns: 1fr auto; }
        .nav-box { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; overflow-x: auto; }
        .products-wrapper { grid-template-columns: 1fr; }
        .sidebar { position: static; }
        .products-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .product-image-wrapper { height: 210px; }
        .product-info { padding: 12px; }
        .product-name { font-size: 16px; }
      }

      /* --- Added with the search / sort / size shopping features --- */
      .topbar { grid-template-columns: 170px 1fr minmax(200px, 270px) auto; }
      .nav-box a {
        padding: 10px 13px;
        border-radius: 10px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background 0.2s, color 0.2s;
      }
      .nav-box a:hover,
      .nav-box a.is-active { background: var(--cream); color: var(--coral); }
      .user-actions { display: flex; align-items: center; gap: 12px; padding-right: 6px; }
      .cart-icon { text-decoration: none; }
      .logout-btn {
        padding: 11px 18px;
        border: 0;
        border-radius: 999px;
        background: var(--forest);
        color: #fffaf2;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.25s;
      }
      .logout-btn:hover { background: var(--coral); }

      /* Each filter group gets a heading and a divider, so the sidebar
         reads as a list of questions rather than one long run of boxes. */
      .filter-group + .filter-group {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 250, 242, 0.18);
      }
      .filter-group strong {
        display: block;
        margin-bottom: 10px;
        color: #f1c9af;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .filter-count { color: rgba(255, 250, 242, 0.55); font-size: 12px; font-weight: 400; }

      .search-summary {
        margin: 0 0 18px;
        padding: 14px 18px;
        border-left: 4px solid var(--coral);
        background: var(--cream);
        font-size: 15px;
      }
      .search-summary strong { color: var(--forest); }
      .search-summary a { color: var(--coral); }

      @media (max-width: 900px) {
        .topbar { grid-template-columns: 1fr auto; }
        .nav-box { grid-column: 1 / -1; grid-row: 3; justify-content: flex-start; overflow-x: auto; }
        .topbar .site-search { grid-column: 1 / -1; grid-row: 2; }
        .user-actions { grid-column: 2; grid-row: 1; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo-box" onclick="location.href='index.html'">
          <img src="./chaddha-logo.svg" alt="Chaddha Fashion logo" />
        </div>
        <nav class="nav-box" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="products.html?category=men">Men</a>
          <a href="products.html?category=women">Women</a>
          <a href="products.html?category=kids">Kids</a>
          <a href="orders.html">Orders</a>
          <a href="blog.html">Blog</a>
        </nav>
        <form class="site-search" data-search-form role="search">
          <input type="search" name="q" placeholder="Search for shirts, kurtas…" aria-label="Search products" />
          <button type="submit">Search</button>
        </form>
        <div class="user-actions">
          <a class="cart-icon" href="cart.html" aria-label="Shopping cart">
            🛒
            <span class="cart-badge" data-cart-count>0</span>
          </a>
          <button class="logout-btn" type="button" data-logout>Logout</button>
        </div>
      </header>

      <h1 class="title" id="page-title">All Products</h1>
      <p class="search-summary" id="search-summary" hidden></p>

      <div class="products-wrapper">
        <!-- Sidebar Filters -->
        <aside class="sidebar">
          <h3>Filters</h3>

          <div class="filter-group">
            <strong>Category</strong>
            <div id="category-filters"></div>
          </div>

          <div class="filter-group">
            <strong>Collection</strong>
            <div id="subcategory-filters"></div>
          </div>

          <div class="filter-group">
            <strong>Price</strong>
            <div class="price-range">
              <input type="number" id="price-min" placeholder="Min" min="0" step="100" aria-label="Minimum price" />
              <span>to</span>
              <input type="number" id="price-max" placeholder="Max" min="0" step="100" aria-label="Maximum price" />
            </div>
          </div>

          <div class="filter-group">
            <strong>Highlights</strong>
            <label><input type="checkbox" data-filter="type" value="featured" /> Featured</label>
            <label><input type="checkbox" data-filter="type" value="new" /> New Arrivals</label>
            <label><input type="checkbox" data-filter="type" value="bestseller" /> Best Sellers</label>
            <label><input type="checkbox" data-filter="type" value="trending" /> Trending</label>
          </div>

          <button class="clear-filters" type="button" id="clear-filters">Clear Filters</button>
        </aside>

        <!-- Products Section -->
        <div class="products-section">
          <div class="sort-bar">
            <p class="sort-bar-count" id="result-count"></p>
            <div class="sort-bar-right">
              <label for="sort-select">Sort by</label>
              <select id="sort-select">
                <option value="featured">Recommended</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="name-asc">Name: A to Z</option>
                <option value="rating-desc">Customer rating</option>
                <option value="newest">New arrivals first</option>
              </select>
            </div>
          </div>

          <div class="active-chips" id="active-chips"></div>

          <div class="products-grid" id="products-grid">
            <!-- Products will be inserted here -->
          </div>
          <div id="no-products" class="no-products" style="display:none;">
            No products found matching your filters
          </div>
        </div>
      </div>
    </div>


    <script src="./shop-data.js"></script>
    <script src="./shop.js"></script>
    <script>
      Shop.requireLogin();
      Shop.initHeader();

      // Everything the shopper has asked for lives in one object, so the
      // URL, the sidebar and the chips above the grid can never disagree.
      const state = {
        query: '',
        categories: [],
        subcategories: [],
        types: [],
        minPrice: null,
        maxPrice: null,
        sort: 'featured'
      };

      buildSidebar();
      readStateFromUrl();
      wireControls();
      update();

      // ----------------------------------------------------------------
      // The sidebar is generated from the catalogue, so a new collection
      // in shop-data.js shows up here without touching this page.
      // ----------------------------------------------------------------
      function buildSidebar() {
        const categories = Object.keys(CATEGORY_LABELS);

        document.getElementById('category-filters').innerHTML = categories
          .map(category => {
            const count = PRODUCTS.filter(product => product.category === category).length;
            return (
              '<label><input type="checkbox" data-filter="category" value="' + category + '" /> ' +
              CATEGORY_LABELS[category] +
              ' <span class="filter-count">(' + count + ')</span></label>'
            );
          })
          .join('');

        document.getElementById('subcategory-filters').innerHTML = SUBCATEGORIES.map(entry => {
          const count = PRODUCTS.filter(product => product.subcategory === entry.value).length;
          return (
            '<label><input type="checkbox" data-filter="subcategory" value="' + entry.value + '" /> ' +
            entry.label +
            ' <span class="filter-count">(' + count + ')</span></label>'
          );
        }).join('');
      }

      // ----------------------------------------------------------------
      // The URL is the source of truth on arrival, so links from the home
      // page, the nav and the search box all land in the right place, and
      // any view can be bookmarked or shared.
      // ----------------------------------------------------------------
      function readStateFromUrl() {
        const params = new URLSearchParams(window.location.search);

        state.query = (params.get('q') || '').trim();
        state.categories = params.getAll('category').filter(value => CATEGORY_LABELS[value]);
        state.subcategories = params
          .getAll('subcategory')
          .filter(value => SUBCATEGORIES.some(entry => entry.value === value));
        state.types = params.getAll('type').filter(value =>
          ['featured', 'new', 'bestseller', 'trending'].includes(value)
        );

        const min = parseInt(params.get('min'), 10);
        const max = parseInt(params.get('max'), 10);
        state.minPrice = isNaN(min) ? null : min;
        state.maxPrice = isNaN(max) ? null : max;

        const sort = params.get('sort');
        if (sort) state.sort = sort;

        // Reflect all of that back into the controls.
        document.querySelectorAll('[data-filter]').forEach(box => {
          const bucket =
            box.dataset.filter === 'category'
              ? state.categories
              : box.dataset.filter === 'subcategory'
              ? state.subcategories
              : state.types;
          box.checked = bucket.includes(box.value);
        });

        if (state.minPrice !== null) document.getElementById('price-min').value = state.minPrice;
        if (state.maxPrice !== null) document.getElementById('price-max').value = state.maxPrice;
        document.getElementById('sort-select').value = state.sort;
      }

      // Keeps the address bar in step without adding history entries.
      function writeStateToUrl() {
        const params = new URLSearchParams();
        if (state.query) params.set('q', state.query);
        state.categories.forEach(value => params.append('category', value));
        state.subcategories.forEach(value => params.append('subcategory', value));
        state.types.forEach(value => params.append('type', value));
        if (state.minPrice !== null) params.set('min', state.minPrice);
        if (state.maxPrice !== null) params.set('max', state.maxPrice);
        if (state.sort !== 'featured') params.set('sort', state.sort);

        const query = params.toString();
        history.replaceState(null, '', query ? '?' + query : window.location.pathname);
      }

      function wireControls() {
        document.querySelectorAll('[data-filter]').forEach(box => {
          box.addEventListener('change', () => {
            const bucket = box.dataset.filter;
            const list =
              bucket === 'category'
                ? state.categories
                : bucket === 'subcategory'
                ? state.subcategories
                : state.types;

            const position = list.indexOf(box.value);
            if (box.checked && position === -1) list.push(box.value);
            if (!box.checked && position !== -1) list.splice(position, 1);
            update();
          });
        });

        // Price boxes settle a moment after typing stops, so the grid does
        // not flicker while a number is half typed.
        let priceTimer = null;
        ['price-min', 'price-max'].forEach(id => {
          document.getElementById(id).addEventListener('input', () => {
            clearTimeout(priceTimer);
            priceTimer = setTimeout(() => {
              const min = parseInt(document.getElementById('price-min').value, 10);
              const max = parseInt(document.getElementById('price-max').value, 10);
              state.minPrice = isNaN(min) ? null : min;
              state.maxPrice = isNaN(max) ? null : max;
              update();
            }, 350);
          });
        });

        document.getElementById('sort-select').addEventListener('change', event => {
          state.sort = event.target.value;
          update();
        });

        document.getElementById('clear-filters').addEventListener('click', () => {
          state.query = '';
          state.categories = [];
          state.subcategories = [];
          state.types = [];
          state.minPrice = null;
          state.maxPrice = null;
          state.sort = 'featured';

          document.querySelectorAll('[data-filter]').forEach(box => (box.checked = false));
          document.getElementById('price-min').value = '';
          document.getElementById('price-max').value = '';
          document.getElementById('sort-select').value = 'featured';
          const searchInput = document.querySelector('[data-search-form] input');
          if (searchInput) searchInput.value = '';

          update();
        });
      }

      // ----------------------------------------------------------------
      // Filtering, then sorting
      // ----------------------------------------------------------------
      function visibleProducts() {
        let list = Shop.searchProducts(state.query);

        if (state.categories.length > 0) {
          list = list.filter(product => state.categories.includes(product.category));
        }
        if (state.subcategories.length > 0) {
          list = list.filter(product => state.subcategories.includes(product.subcategory));
        }
        if (state.types.length > 0) {
          list = list.filter(product =>
            state.types.some(type => {
              if (type === 'featured') return product.featured;
              if (type === 'new') return product.newArrival;
              if (type === 'bestseller') return product.bestSeller;
              if (type === 'trending') return product.trending;
              return false;
            })
          );
        }
        if (state.minPrice !== null) {
          list = list.filter(product => product.price >= state.minPrice);
        }
        if (state.maxPrice !== null) {
          list = list.filter(product => product.price <= state.maxPrice);
        }

        return sortProducts(list);
      }

      function sortProducts(list) {
        const sorted = list.slice();
        switch (state.sort) {
          case 'price-asc':
            return sorted.sort((a, b) => a.price - b.price);
          case 'price-desc':
            return sorted.sort((a, b) => b.price - a.price);
          case 'name-asc':
            return sorted.sort((a, b) => a.name.localeCompare(b.name));
          case 'rating-desc':
            return sorted.sort((a, b) => b.rating - a.rating || b.reviews - a.reviews);
          case 'newest':
            return sorted.sort((a, b) => Number(b.newArrival) - Number(a.newArrival) || b.id - a.id);
          default:
            // "Recommended": featured first, then best sellers, then by id.
            return sorted.sort(
              (a, b) =>
                Number(b.featured) - Number(a.featured) ||
                Number(b.bestSeller) - Number(a.bestSeller) ||
                a.id - b.id
            );
        }
      }

      // ----------------------------------------------------------------
      // Drawing the page
      // ----------------------------------------------------------------
      function update() {
        writeStateToUrl();
        const list = visibleProducts();

        renderTitle(list.length);
        renderChips();
        renderGrid(list);
      }

      function renderTitle(count) {
        const title = document.getElementById('page-title');
        const summary = document.getElementById('search-summary');

        if (state.query) {
          title.textContent = 'Search results';
          summary.hidden = false;
          summary.innerHTML =
            count === 0
              ? 'Nothing matched <strong>' + escapeHtml(state.query) + '</strong>. Try a shorter word, or <a href="products.html">browse everything</a>.'
              : 'Showing matches for <strong>' + escapeHtml(state.query) + '</strong>.';
        } else if (state.categories.length === 1) {
          title.textContent = CATEGORY_LABELS[state.categories[0]] + "'s Collection";
          summary.hidden = true;
        } else {
          title.textContent = 'All Products';
          summary.hidden = true;
        }

        document.getElementById('result-count').innerHTML =
          '<strong>' + count + '</strong> ' + (count === 1 ? 'product' : 'products') +
          ' of ' + PRODUCTS.length;
      }

      // A removable chip for each active filter, so it is always obvious
      // why the grid is showing what it is showing.
      function renderChips() {
        const chips = [];

        if (state.query) {
          chips.push({ label: '“' + state.query + '”', kind: 'query', value: state.query });
        }
        state.categories.forEach(value =>
          chips.push({ label: CATEGORY_LABELS[value], kind: 'category', value: value })
        );
        state.subcategories.forEach(value => {
          const entry = SUBCATEGORIES.find(item => item.value === value);
          chips.push({ label: entry ? entry.label : value, kind: 'subcategory', value: value });
        });
        state.types.forEach(value => {
          const labels = {
            featured: 'Featured',
            new: 'New Arrivals',
            bestseller: 'Best Sellers',
            trending: 'Trending'
          };
          chips.push({ label: labels[value] || value, kind: 'type', value: value });
        });
        if (state.minPrice !== null || state.maxPrice !== null) {
          const from = state.minPrice !== null ? Shop.money(state.minPrice) : 'any';
          const to = state.maxPrice !== null ? Shop.money(state.maxPrice) : 'any';
          chips.push({ label: from + ' – ' + to, kind: 'price', value: 'price' });
        }

        const host = document.getElementById('active-chips');
        if (chips.length === 0) {
          host.innerHTML = '';
          return;
        }

        host.innerHTML = chips
          .map(
            chip =>
              '<span class="active-chip">' + escapeHtml(chip.label) +
              '<button type="button" data-chip-kind="' + chip.kind + '" ' +
              'data-chip-value="' + escapeHtml(chip.value) + '" ' +
              'aria-label="Remove filter ' + escapeHtml(chip.label) + '">✕</button></span>'
          )
          .join('');

        host.querySelectorAll('button').forEach(button => {
          button.addEventListener('click', () => removeChip(button.dataset.chipKind, button.dataset.chipValue));
        });
      }

      function removeChip(kind, value) {
        if (kind === 'query') {
          state.query = '';
          const searchInput = document.querySelector('[data-search-form] input');
          if (searchInput) searchInput.value = '';
        } else if (kind === 'price') {
          state.minPrice = null;
          state.maxPrice = null;
          document.getElementById('price-min').value = '';
          document.getElementById('price-max').value = '';
        } else {
          const list =
            kind === 'category'
              ? state.categories
              : kind === 'subcategory'
              ? state.subcategories
              : state.types;
          const position = list.indexOf(value);
          if (position !== -1) list.splice(position, 1);

          const box = document.querySelector(
            '[data-filter="' + kind + '"][value="' + value.replace(/"/g, '\\"') + '"]'
          );
          if (box) box.checked = false;
        }
        update();
      }

      function renderGrid(list) {
        const grid = document.getElementById('products-grid');
        const empty = document.getElementById('no-products');

        if (list.length === 0) {
          grid.innerHTML = '';
          empty.style.display = 'block';
          empty.textContent = state.query
            ? 'No products matched your search and filters.'
            : 'No products found matching your filters.';
          return;
        }

        empty.style.display = 'none';
        grid.innerHTML = list
          .map(product => {
            const sizeNote =
              product.sizes.length === 1
                ? product.sizes[0]
                : product.sizes[0] + ' – ' + product.sizes[product.sizes.length - 1];

            return (
              '<div class="product-card">' +
              '<a class="product-image-wrapper" href="product.html?id=' + product.id + '">' +
              '<img src="' + product.image + '" alt="' + escapeHtml(product.name) + '" class="product-image" loading="lazy" />' +
              '<div class="add-to-cart-overlay">' +
              '<span class="add-cart-btn-overlay">View &amp; pick size</span>' +
              '</div>' +
              '</a>' +
              '<div class="product-info">' +
              '<div class="product-category">' + Shop.categoryLabel(product.category) + ' · ' + escapeHtml(product.subcategory) + '</div>' +
              '<h4 class="product-name"><a href="product.html?id=' + product.id + '" style="color:inherit;text-decoration:none;">' + escapeHtml(product.name) + '</a></h4>' +
              '<p class="product-description">' + escapeHtml(product.description) + '</p>' +
              '<div class="product-price">' + Shop.money(product.price) + '</div>' +
              '<div class="product-sizes" style="color: var(--muted); font-size: 12px; margin: -4px 0 10px;">' +
              '<span class="shop-stars">' + Shop.stars(product.rating) + '</span> ' + product.rating.toFixed(1) +
              ' · Sizes ' + escapeHtml(sizeNote) +
              '</div>' +
              '<a class="add-cart-btn" href="product.html?id=' + product.id + '" style="display:block;text-align:center;text-decoration:none;padding:9px;">Choose size</a>' +
              '</div>' +
              '</div>'
            );
          })
          .join('');
      }

      // Product names and search words are put into markup above, so they
      // get escaped first.
      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
    </script>
  </body>
</html>
