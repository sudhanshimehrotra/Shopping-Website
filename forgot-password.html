<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Chaddha Fashion</title>
    <style>
      :root {
        --bg: #f7f1ee;
        --panel: #fffaf8;
        --text: #1d1d1d;
        --muted: #5d5d5d;
        --accent: #b91c5c;
        --accent-dark: #8f1544;
        --gold: #d97706;
        --border: rgba(27, 27, 27, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f6ece8, #f9f5f2 45%, #f4e5dd);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .reset-shell {
        width: min(440px, 100%);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 18px 45px rgba(134, 54, 82, 0.12);
        overflow: hidden;
      }

      .brand-bar {
        background: linear-gradient(135deg, var(--accent), var(--gold));
        padding: 28px 24px 22px;
        text-align: center;
        color: white;
      }

      .brand-mark {
        width: 84px;
        height: 84px;
        margin: 0 auto 14px;
        border-radius: 22px;
        background: rgba(255,255,255,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
        border: 2px solid rgba(255,255,255,0.5);
      }

      .brand-bar h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 38px);
        letter-spacing: 0.04em;
      }

      .brand-bar p {
        margin: 8px 0 0;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 12px;
        opacity: 0.9;
      }

      .form-box {
        padding: 26px 24px 30px;
      }

      .field {
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 700;
        color: var(--muted);
      }

      .field input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #e7d4d8;
        background: #fffaf9;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(185, 28, 92, 0.12);
      }

      .reset-btn {
        width: 100%;
        padding: 14px 16px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--gold));
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 10px 22px rgba(185, 28, 92, 0.2);
      }

      .reset-btn:hover {
        transform: translateY(-1px);
      }

      .note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .note a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="reset-shell">
      <div class="brand-bar">
        <div class="brand-mark">CF</div>
        <h1>Chaddha Fashion</h1>
        <p>Reset Password</p>
      </div>

      <div class="form-box">
        <form id="forgotPasswordForm">
          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>

          <button type="submit" class="reset-btn">Send Reset Link</button>

          <div class="note">
            We’ll help you recover your account. <a href="login.html">Back to login</a>
          </div>
        </form>
      </div>
    </div>

    <script>
      const forgotPasswordForm = document.getElementById('forgotPasswordForm');

      forgotPasswordForm.addEventListener('submit', function (event) {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();

        if (!email) {
          alert('Please enter your email address.');
          return;
        }

        const users = JSON.parse(localStorage.getItem('chaddha_users') || '[]');
        const userExists = users.some(user => user.email.toLowerCase() === email.toLowerCase());

        if (!userExists) {
          alert('No account found for this email. Please sign up first.');
          return;
        }

        localStorage.setItem('chaddha_reset_email', email);
        alert('Password reset instructions have been prepared for ' + email + '. Please check your email and return to login.');
        window.location.href = 'login.html';
      });
    </script>
  </body>
</html>
