<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your Chaddha Fashion account." />
    <title>Login | Chaddha Fashion</title>
    <link rel="icon" href="./chaddha-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./shop.css" />
    <style>
      :root {
        --bg: #f7f1ee;
        --panel: #fffaf8;
        --text: #1d1d1d;
        --muted: #5d5d5d;
        --accent: #b91c5c;
        --accent-dark: #8f1544;
        --gold: #d97706;
        --border: rgba(27, 27, 27, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f6ece8, #f9f5f2 45%, #f4e5dd);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .login-shell {
        width: min(420px, 100%);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 18px 45px rgba(134, 54, 82, 0.12);
        overflow: hidden;
      }

      .brand-bar {
        background: linear-gradient(135deg, var(--accent), var(--gold));
        padding: 28px 24px 22px;
        text-align: center;
        color: white;
      }

      .brand-mark {
        width: 84px;
        height: 84px;
        margin: 0 auto 14px;
        border-radius: 22px;
        background: rgba(255,255,255,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
        border: 2px solid rgba(255,255,255,0.5);
      }

      .brand-bar h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 38px);
        letter-spacing: 0.04em;
      }

      .brand-bar p {
        margin: 8px 0 0;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 12px;
        opacity: 0.9;
      }

      .form-box {
        padding: 26px 24px 30px;
      }

      .field {
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 700;
        color: var(--muted);
      }

      .field input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #e7d4d8;
        background: #fffaf9;
        font-size: 16px;
        outline: none;
        transition: border-color 2.2s, box-shadow 0.2s;
      }

      .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(185, 28, 92, 0.12);
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 10px 0 20px;
        font-size: 13px;
        color: var(--muted);
      }

      .row label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .row a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      .login-btn {
        width: 100%;
        padding: 14px 16px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--gold));
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 10px 22px rgba(185, 28, 92, 0.2);
      }

      .login-btn:hover {
        transform: translateY(-1px);
      }

      .signup-note {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }

      .signup-note a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      .demo {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #fff4f7;
        border: 1px solid #f7d1df;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="brand-bar">
        <div class="brand-mark">CF</div>
        <h1>Chaddha Fashion</h1>
        <p>Welcome Back</p>
      </div>

      <div class="form-box">
        <form id="loginForm">
          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>

          <div class="row">
            <label><input type="checkbox" /> Remember me</label>
            <a href="forgot-password.html">Forgot password?</a>
          </div>

          <button type="submit" class="login-btn">Login to Shop</button>

          <div class="demo">
            Accounts are stored on the server. Create an account first, then log in.
          </div>

          <div class="signup-note">
            New customer? <a href="signup.html">Create account</a>
          </div>
        </form>
      </div>
    </div>

    <script src="./shop-data.js"></script>
    <script src="./shop.js"></script>
    <script>
      const loginForm = document.getElementById('loginForm');
      const loginButton = loginForm.querySelector('.login-btn');

      Shop.watchFieldsForRepair(loginForm);

      // If something bounced us here, go back there after a good login.
      function destinationAfterLogin() {
        const next = new URLSearchParams(window.location.search).get('next');
        // Only same-site page names, so this cannot be pointed elsewhere.
        if (next && /^[\w.-]+\.html(\?[^#]*)?$/.test(next)) return next;
        return 'index.html';
      }

      loginForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        Shop.clearFieldErrors(loginForm);

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        let problems = 0;
        if (!email) {
          Shop.showFieldError('email', 'Please enter your email address.');
          problems += 1;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
          Shop.showFieldError('email', 'That email address does not look right.');
          problems += 1;
        }
        if (!password) {
          Shop.showFieldError('password', 'Please enter your password.');
          problems += 1;
        }
        if (problems > 0) return;

        loginButton.disabled = true;
        loginButton.textContent = 'Signing you in…';

        try {
          // Send the details to our Node server and wait for its answer.
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (!response.ok) {
            // The server deliberately does not say which half was wrong,
            // so the message goes under the password field.
            Shop.showFieldError('password', data.error || 'Login failed. Please try again.');
            Shop.toast(data.error || 'Login failed.', 'error');
            return;
          }

          // The server gave us a token that proves we are logged in.
          localStorage.setItem('chaddha_token', data.token);

          Shop.toast('Welcome back, ' + (data.fullName || 'friend') + '!', 'success');
          setTimeout(() => {
            window.location.href = destinationAfterLogin();
          }, 700);
        } catch (error) {
          Shop.toast('Could not reach the server. Is it running on port 3000?', 'error');
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = 'Login to Shop';
        }
      });
    </script>
  </body>
</html>
